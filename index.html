<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>Atmos - Clima Avanzado</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { glass: 'rgba(255, 255, 255, 0.1)' }
                }
            }
        }
    </script>

    <!-- Leaflet CSS (Radar) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Base y Reseteo */
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; margin: 0; overflow: hidden; }

        /* Scrollbars invisibles pero funcionales */
        ::-webkit-scrollbar { width: 0px; height: 0px; }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .liquid-nav {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        /* Nav Item Animado */
        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-item.active { background: rgba(255, 255, 255, 0.25); transform: scale(1.1); color: #fff; }
        .nav-item:not(.active) { color: rgba(255, 255, 255, 0.6); }

        /* Animaciones Atmosféricas */
        .bg-layer { transition: background 1.5s ease-in-out; }
        
        @keyframes floatCloud {
            0% { transform: translateX(-100%); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateX(100vw); opacity: 0; }
        }
        
        .cloud {
            position: absolute; background: white; border-radius: 50px; filter: blur(20px);
            animation: floatCloud linear infinite; opacity: 0;
        }

        @keyframes rainDrop {
            0% { transform: translateY(-10vh) rotate(15deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(15deg); opacity: 0; }
        }
