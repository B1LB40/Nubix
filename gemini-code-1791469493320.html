<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Nubix - Clima Avanzado</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>

    <!-- Leaflet CSS (Radar) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Base y Reseteo */
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            transition: color 0.3s ease;
        }

        /* Variables CSS para Light/Dark Mode Glassmorphism */
        :root {
            --text-main: #0f172a;
            --text-muted: #334155;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --nav-bg: rgba(255, 255, 255, 0.7);
            --nav-active: rgba(255, 255, 255, 0.9);
            --theme-overlay: rgba(255, 255, 255, 0.3);
        }

        .dark {
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(0, 0, 0, 0.25);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --nav-bg: rgba(15, 23, 42, 0.6);
            --nav-active: rgba(255, 255, 255, 0.2);
            --theme-overlay: rgba(0, 0, 0, 0.6);
        }

        /* Aplicación de Variables */
        body { color: var(--text-main); }
        .text-muted { color: var(--text-muted); }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        
        .liquid-nav {
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: var(--text-muted); }
        .nav-item.active { background: var(--nav-active); transform: scale(1.1); color: var(--text-main); }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 0px; height: 0px; }

        /* Animaciones Atmosféricas */
        .bg-layer { transition: background 1.5s ease-in-out; }
        .theme-overlay { background-color: var(--theme-overlay); transition: background-color 0.5s ease; }
        
        @keyframes floatCloud {
            0% { transform: translateX(-100%); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateX(100vw); opacity: 0; }
        }
        
        .cloud {
            position: absolute; background: white; border-radius: 50px; filter: blur(20px);
            animation: floatCloud linear infinite; opacity: 0;
        }

        @keyframes rainDrop {
            0% { transform: translateY(-10vh) rotate(15deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(15deg); opacity: 0; }
        }

        .raindrop {
            position: absolute; width: 2px; height: 15px; 
            background: linear-gradient(transparent, rgba(255,255,255,0.8));
            animation: rainDrop linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }

        .sun-glow {
            position: absolute; top: 10%; right: 10%; width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(253,224,71,0.8) 0%, rgba(253,186,116,0) 70%);
            border-radius: 50%; filter: blur(20px); animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Mapa de Radar */
        #map { width: 100%; height: 100%; border-radius: 1.5rem; z-index: 1; }
        .leaflet-control-zoom { border: none !important; }
        .leaflet-control-zoom a { 
            background: var(--glass-bg) !important; 
            color: var(--text-main) !important; 
            border: 1px solid var(--glass-border) !important; 
            backdrop-filter: blur(10px); 
        }
    </style>
</head>
<body class="antialiased">

    <!-- Capa de Fondo Dinámico -->
    <div id="bg-container" class="fixed inset-0 z-0 bg-layer bg-gradient-to-b from-blue-400 to-blue-200 pointer-events-none">
        <div id="fx-layer" class="absolute inset-0 overflow-hidden w-full h-full"></div>
        <div class="absolute inset-0 theme-overlay"></div> <!-- Filtro para Light/Dark Mode -->
    </div>

    <!-- Contenedor Principal App -->
    <div class="relative z-10 w-full h-screen h-[100dvh] flex flex-col">
        
        <!-- VISTA: CLIMA ACTUAL -->
        <main id="view-home" class="flex-1 overflow-y-auto pb-28 px-5 pt-12 transition-opacity duration-300">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <div class="flex flex-col">
                    <h1 id="loc-name" class="text-3xl font-bold tracking-tight drop-shadow-md">Nubix</h1>
                    <p id="loc-date" class="text-sm font-medium text-muted drop-shadow-sm">Iniciando...</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="app.toggleTheme()" class="p-3 glass-panel rounded-full hover:opacity-80 transition">
                        <i id="theme-icon" data-lucide="sun" class="w-5 h-5"></i>
                    </button>
                    <button onclick="app.getLocation()" class="p-3 glass-panel rounded-full hover:opacity-80 transition">
                        <i data-lucide="map-pin" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div id="loading-state" class="text-center mt-10">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4"></i>
                <p class="font-medium">Cargando clima...</p>
            </div>

            <div id="weather-content" class="hidden">
                <!-- Hero Clima -->
                <div class="flex flex-col items-center mb-10 drop-shadow-lg">
                    <i id="hero-icon" data-lucide="sun" class="w-24 h-24 mb-4"></i>
                    <div class="flex items-start">
                        <span id="hero-temp" class="text-7xl font-bold tracking-tighter">--</span>
                        <span class="text-4xl font-medium mt-2">°</span>
                    </div>
                    <p id="hero-desc" class="text-xl font-medium mt-2 capitalize text-center px-4">--</p>
                    <div class="flex items-center gap-2 mt-3 glass-panel px-4 py-1.5 rounded-full border-none">
                        <span class="text-sm font-medium">RealFeel®</span>
                        <span id="hero-feel" class="text-sm font-bold">--°</span>
                    </div>
                </div>

                <!-- Previsión por Horas (Scroll Horizontal) -->
                <div class="glass-panel rounded-3xl p-5 mb-6">
                    <h3 class="text-sm font-semibold text-muted uppercase tracking-wider mb-4 flex items-center gap-2">
                        <i data-lucide="clock" class="w-4 h-4"></i> Próximas Horas
                    </h3>
                    <div id="hourly-forecast" class="flex overflow-x-auto gap-4 pb-2 snap-x">
                        <!-- Items JS -->
                    </div>
                </div>

                <!-- Previsión 7 Días -->
                <div class="glass-panel rounded-3xl p-5 mb-6">
                    <h3 class="text-sm font-semibold text-muted uppercase tracking-wider mb-4 flex items-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4"></i> Previsión Extendida
                    </h3>
                    <div id="daily-forecast" class="flex flex-col gap-4">
                        <!-- Items JS -->
                    </div>
                </div>

                <!-- Grid de Detalles Avanzados -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-panel rounded-3xl p-4 flex flex-col justify-between">
                        <div class="flex items-center gap-2 text-muted mb-2">
                            <i data-lucide="droplets" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase">Humedad</span>
                        </div>
                        <p id="det-humidity" class="text-2xl font-bold">--%</p>
                    </div>
                    <div class="glass-panel rounded-3xl p-4 flex flex-col justify-between">
                        <div class="flex items-center gap-2 text-muted mb-2">
                            <i data-lucide="wind" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase">Viento</span>
                        </div>
                        <p id="det-wind" class="text-2xl font-bold">-- km/h</p>
                        <p id="det-wind-dir" class="text-xs text-muted mt-1">--</p>
                    </div>
                    <div class="glass-panel rounded-3xl p-4 flex flex-col justify-between">
                        <div class="flex items-center gap-2 text-muted mb-2">
                            <i data-lucide="sun-dim" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase">Índice UV</span>
                        </div>
                        <p id="det-uv" class="text-2xl font-bold">--</p>
                    </div>
                    <div class="glass-panel rounded-3xl p-4 flex flex-col justify-between">
                        <div class="flex items-center gap-2 text-muted mb-2">
                            <i data-lucide="cloud-rain" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase">Lluvia</span>
                        </div>
                        <p id="det-rain-prob" class="text-2xl font-bold">--%</p>
                    </div>
                    <div class="glass-panel rounded-3xl p-4 flex flex-col justify-between">
                        <div class="flex items-center gap-2 text-muted mb-2">
                            <i data-lucide="gauge" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase">Presión</span>
                        </div>
                        <p id="det-pressure" class="text-2xl font-bold">-- hPa</p>
                    </div>
                    <div class="glass-panel rounded-3xl p-4 flex flex-col justify-between">
                        <div class="flex items-center gap-2 text-muted mb-2">
                            <i data-lucide="eye" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase">Visibilidad</span>
                        </div>
                        <p id="det-vis" class="text-2xl font-bold">-- km</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- VISTA: RADAR METEOROLÓGICO -->
        <main id="view-radar" class="hidden flex-1 flex flex-col p-5 pt-12 pb-28">
            <h2 class="text-2xl font-bold mb-4 drop-shadow">Radar en Directo</h2>
            <div class="flex-1 glass-panel p-2 rounded-[2rem] relative overflow-hidden">
                <div id="map"></div>
                <div class="absolute bottom-4 left-4 right-4 z-[1000] glass-panel rounded-xl p-3 flex justify-between items-center">
                    <span class="text-xs font-medium">Lluvia / Tormentas</span>
                    <div class="w-32 h-2 rounded-full bg-gradient-to-r from-blue-500 via-yellow-400 to-red-600"></div>
                </div>
            </div>
        </main>

        <!-- VISTA: FAVORITOS Y BÚSQUEDA -->
        <main id="view-favorites" class="hidden flex-1 overflow-y-auto p-5 pt-12 pb-28">
            <h2 class="text-2xl font-bold mb-6 drop-shadow">Mis Ciudades</h2>
            
            <div class="relative mb-8">
                <input type="text" id="search-input" placeholder="Buscar ciudad..." class="w-full glass-panel rounded-2xl py-4 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-400 transition" style="color: var(--text-main)">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-muted"></i>
                <!-- Resultados Autocompletado -->
                <div id="search-results" class="absolute top-full left-0 right-0 mt-2 glass-panel rounded-xl hidden flex-col z-50 max-h-60 overflow-y-auto"></div>
            </div>

            <div id="favorites-list" class="flex flex-col gap-4">
                <!-- Favs JS -->
            </div>
        </main>

    </div>

    <!-- Barra de Navegación Inferior (Liquid Glass) -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm liquid-nav rounded-full px-2 py-2 flex justify-between items-center z-50">
        <button onclick="app.switchTab('home')" id="tab-home" class="nav-item active flex-1 flex flex-col items-center justify-center py-2 rounded-full">
            <i data-lucide="cloud-sun" class="w-6 h-6"></i>
        </button>
        <button onclick="app.switchTab('radar')" id="tab-radar" class="nav-item flex-1 flex flex-col items-center justify-center py-2 rounded-full">
            <i data-lucide="map" class="w-6 h-6"></i>
        </button>
        <button onclick="app.switchTab('favorites')" id="tab-favorites" class="nav-item flex-1 flex flex-col items-center justify-center py-2 rounded-full">
            <i data-lucide="bookmark" class="w-6 h-6"></i>
        </button>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        // --- CONSTANTES Y UTILIDADES ---
        const WMO_CODES = {
            0: { desc: 'Despejado', icon: 'sun', bg: ['from-blue-400', 'to-blue-200'] },
            1: { desc: 'Mayormente despejado', icon: 'cloud-sun', bg: ['from-blue-400', 'to-blue-300'] },
            2: { desc: 'Parcialmente nublado', icon: 'cloud', bg: ['from-gray-300', 'to-blue-200'] },
            3: { desc: 'Nublado', icon: 'cloud', bg: ['from-gray-400', 'to-gray-300'] },
            45: { desc: 'Niebla', icon: 'cloud-fog', bg: ['from-gray-300', 'to-gray-200'] },
            48: { desc: 'Niebla', icon: 'cloud-fog', bg: ['from-gray-300', 'to-gray-200'] },
            51: { desc: 'Llovizna ligera', icon: 'cloud-drizzle', bg: ['from-slate-400', 'to-slate-300'] },
            53: { desc: 'Llovizna moderada', icon: 'cloud-drizzle', bg: ['from-slate-500', 'to-slate-400'] },
            55: { desc: 'Llovizna densa', icon: 'cloud-drizzle', bg: ['from-slate-500', 'to-slate-400'] },
            61: { desc: 'Lluvia ligera', icon: 'cloud-rain', bg: ['from-slate-600', 'to-slate-400'] },
            63: { desc: 'Lluvia moderada', icon: 'cloud-rain', bg: ['from-slate-600', 'to-slate-500'] },
            65: { desc: 'Lluvia fuerte', icon: 'cloud-rain', bg: ['from-slate-700', 'to-slate-600'] },
            71: { desc: 'Nieve ligera', icon: 'cloud-snow', bg: ['from-blue-200', 'to-white'] },
            73: { desc: 'Nieve moderada', icon: 'cloud-snow', bg: ['from-blue-200', 'to-gray-200'] },
            75: { desc: 'Nieve fuerte', icon: 'cloud-snow', bg: ['from-gray-300', 'to-gray-100'] },
            95: { desc: 'Tormenta eléctrica', icon: 'cloud-lightning', bg: ['from-slate-800', 'to-slate-600'] },
        };

        function getWeatherData(code, isDay) {
            let data = WMO_CODES[code] || WMO_CODES[0];
            let icon = data.icon;
            if (code === 0 && !isDay) icon = 'moon';
            if ((code === 1 || code === 2) && !isDay) icon = 'cloud-moon';
            return { ...data, icon };
        }

        const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        
        // --- LOGICA PRINCIPAL DE LA APP ---
        const app = {
            state: {
                lat: 40.4165, lon: -3.7026, name: 'Madrid', // Por defecto si falla el GPS
                weather: null,
                favorites: JSON.parse(localStorage.getItem('nubix_favs')) || [],
                map: null,
                radarLayer: null,
                baseLayer: null,
                isDark: localStorage.getItem('nubix_theme') !== 'light'
            },

            init() {
                // Configurar Tema
                this.applyTheme();
                this.updateDate();
                this.bindEvents();
                lucide.createIcons();
                
                // Intentar geolocalización con Timeout de 3 segundos
                const timeout = new Promise((resolve) => setTimeout(() => resolve('timeout'), 3000));
                const locationPromise = new Promise((resolve, reject) => {
                    if (!navigator.geolocation) return reject();
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                });

                Promise.race([locationPromise, timeout]).then(result => {
                    if (result === 'timeout' || !result.coords) {
                        this.loadLocation(this.state.lat, this.state.lon, this.state.name);
                    } else {
                        this.loadLocation(result.coords.latitude, result.coords.longitude, 'Mi Ubicación');
                    }
                }).catch(() => {
                    this.loadLocation(this.state.lat, this.state.lon, this.state.name);
                });
                
                this.renderFavorites();
            },

            toggleTheme() {
                this.state.isDark = !this.state.isDark;
                localStorage.setItem('nubix_theme', this.state.isDark ? 'dark' : 'light');
                this.applyTheme();
            },

            applyTheme() {
                const html = document.documentElement;
                const icon = document.getElementById('theme-icon');
                if (this.state.isDark) {
                    html.classList.add('dark');
                    if (icon) icon.setAttribute('data-lucide', 'sun');
                } else {
                    html.classList.remove('dark');
                    if (icon) icon.setAttribute('data-lucide', 'moon');
                }
                lucide.createIcons();
                this.updateMapTheme();
            },

            updateDate() {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                let dateStr = new Date().toLocaleDateString('es-ES', options);
                document.getElementById('loc-date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
            },

            bindEvents() {
                const search = document.getElementById('search-input');
                let timer = null;
                search.addEventListener('input', (e) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => this.searchCity(e.target.value), 500);
                });
            },

            switchTab(tab) {
                ['home', 'radar', 'favorites'].forEach(t => {
                    document.getElementById(`tab-${t}`).classList.remove('active');
                    document.getElementById(`view-${t}`).classList.add('hidden');
                });
                document.getElementById(`tab-${tab}`).classList.add('active');
                document.getElementById(`view-${tab}`).classList.remove('hidden');

                if (tab === 'radar') this.initRadar();
            },

            getLocation() {
                document.getElementById('loc-name').innerText = "Buscando...";
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        this.loadLocation(pos.coords.latitude, pos.coords.longitude, 'Mi Ubicación');
                        this.switchTab('home');
                    }, () => {
                        alert("Activa el GPS y permite el acceso para tu ubicación.");
                        document.getElementById('loc-name').innerText = this.state.name;
                    });
                }
            },

            async loadLocation(lat, lon, name) {
                this.state.lat = lat; this.state.lon = lon; this.state.name = name;
                document.getElementById('loc-name').innerText = name;
                document.getElementById('loading-state').classList.remove('hidden');
                document.getElementById('weather-content').classList.add('hidden');
                await this.fetchWeather(lat, lon);
            },

            async fetchWeather(lat, lon) {
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code,visibility,uv_index,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("API Error");
                    this.state.weather = await res.json();
                    
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('weather-content').classList.remove('hidden');
                    
                    this.updateUI();
                } catch (error) {
                    console.error("Error al obtener clima:", error);
                    document.getElementById('loading-state').innerHTML = `<p class="text-red-500 font-bold">Error al cargar datos. Verifica tu conexión.</p>`;
                }
            },

            updateUI() {
                const { current, hourly, daily } = this.state.weather;
                const wData = getWeatherData(current.weather_code, current.is_day);
                
                this.updateAtmosphere(wData, current.is_day);

                document.getElementById('hero-temp').innerText = Math.round(current.temperature_2m);
                document.getElementById('hero-desc').innerText = wData.desc;
                document.getElementById('hero-feel').innerText = `${Math.round(current.apparent_temperature)}°`;
                
                document.getElementById('hero-icon').setAttribute('data-lucide', wData.icon);
                
                document.getElementById('det-humidity').innerText = `${current.relative_humidity_2m}%`;
                document.getElementById('det-wind').innerText = `${current.wind_speed_10m} km/h`;
                document.getElementById('det-wind-dir').innerText = this.getWindDir(current.wind_direction_10m);
                document.getElementById('det-pressure').innerText = `${Math.round(current.surface_pressure)} hPa`;
                
                const hourIndex = new Date().getHours();
                document.getElementById('det-uv').innerText = hourly.uv_index[hourIndex] || 0;
                document.getElementById('det-vis').innerText = hourly.visibility[hourIndex] ? `${(hourly.visibility[hourIndex]/1000).toFixed(1)} km` : '--';
                document.getElementById('det-rain-prob').innerText = `${hourly.precipitation_probability[hourIndex] || 0}%`;

                // Render Prev. Horas
                const hourlyContainer = document.getElementById('hourly-forecast');
                hourlyContainer.innerHTML = '';
                for(let i=hourIndex; i < hourIndex+24; i+=2) {
                    const time = new Date(hourly.time[i]);
                    const hourStr = time.getHours() === hourIndex ? 'Ahora' : `${time.getHours()}:00`;
                    const hData = getWeatherData(hourly.weather_code[i], time.getHours() > 6 && time.getHours() < 20);
                    
                    hourlyContainer.innerHTML += `
                        <div class="flex flex-col items-center min-w-[70px] snap-center">
                            <span class="text-sm text-muted mb-2">${hourStr}</span>
                            <i data-lucide="${hData.icon}" class="w-6 h-6 mb-2"></i>
                            <span class="font-bold text-lg">${Math.round(hourly.temperature_2m[i])}°</span>
                        </div>
                    `;
                }

                // Render Prev. Diaria
                const dailyContainer = document.getElementById('daily-forecast');
                dailyContainer.innerHTML = '';
                for(let i=0; i < 7; i++) {
                    const date = new Date(daily.time[i]);
                    const dayName = i === 0 ? 'Hoy' : days[date.getDay()];
                    const dData = getWeatherData(daily.weather_code[i], 1);
                    const min = Math.round(daily.temperature_2m_min[i]);
                    const max = Math.round(daily.temperature_2m_max[i]);

                    const globalMin = Math.min(...daily.temperature_2m_min);
                    const globalMax = Math.max(...daily.temperature_2m_max);
                    const left = ((min - globalMin) / (globalMax - globalMin)) * 100;
                    const width = ((max - min) / (globalMax - globalMin)) * 100;

                    dailyContainer.innerHTML += `
                        <div class="flex items-center justify-between">
                            <span class="w-12 font-medium">${dayName}</span>
                            <i data-lucide="${dData.icon}" class="w-5 h-5 mx-2 text-muted"></i>
                            <div class="flex-1 flex items-center gap-3">
                                <span class="w-6 text-right text-sm text-muted">${min}°</span>
                                <div class="flex-1 h-1.5 bg-gray-500/30 rounded-full overflow-hidden relative">
                                    <div class="absolute h-full bg-gradient-to-r from-blue-400 to-yellow-400 rounded-full" 
                                         style="left: ${left}%; width: ${Math.max(width, 10)}%"></div>
                                </div>
                                <span class="w-6 text-sm font-bold">${max}°</span>
                            </div>
                        </div>
                    `;
                }

                lucide.createIcons();
            },

            updateAtmosphere(wData, isDay) {
                const bgCont = document.getElementById('bg-container');
                const fxLayer = document.getElementById('fx-layer');
                
                // Si es de noche forzamos colores más oscuros en el fondo subyacente
                let bgClasses = isDay ? wData.bg : ['from-slate-900', 'to-slate-800'];
                bgCont.className = `fixed inset-0 z-0 bg-layer bg-gradient-to-b ${bgClasses[0]} ${bgClasses[1]} pointer-events-none`;
                
                fxLayer.innerHTML = '';

                if (wData.desc.toLowerCase().includes('despejado') && isDay) {
                    fxLayer.innerHTML = '<div class="sun-glow"></div>';
                }

                if (!isDay && wData.desc.toLowerCase().includes('despejado')) {
                    for(let i=0; i<50; i++) {
                        let star = document.createElement('div');
                        star.className = 'star';
                        star.style.width = Math.random() * 3 + 'px';
                        star.style.height = star.style.width;
                        star.style.top = Math.random() * 100 + 'vh';
                        star.style.left = Math.random() * 100 + 'vw';
                        star.style.animationDelay = Math.random() * 2 + 's';
                        fxLayer.appendChild(star);
                    }
                }

                if (wData.icon.includes('cloud')) {
                    for(let i=0; i<4; i++) {
                        let cloud = document.createElement('div');
                        cloud.className = 'cloud';
                        cloud.style.width = (Math.random() * 200 + 100) + 'px';
                        cloud.style.height = (Math.random() * 60 + 40) + 'px';
                        cloud.style.top = Math.random() * 30 + 'vh';
                        cloud.style.animationDuration = (Math.random() * 30 + 40) + 's';
                        cloud.style.animationDelay = (Math.random() * -20) + 's';
                        fxLayer.appendChild(cloud);
                    }
                }

                if (wData.icon.includes('rain') || wData.icon.includes('drizzle') || wData.icon.includes('lightning')) {
                    for(let i=0; i<100; i++) {
                        let drop = document.createElement('div');
                        drop.className = 'raindrop';
                        drop.style.left = Math.random() * 100 + 'vw';
                        drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
                        drop.style.animationDelay = Math.random() * 2 + 's';
                        fxLayer.appendChild(drop);
                    }
                }
            },

            // --- RADAR LOGIC ---
            initRadar() {
                if (this.state.map) {
                    setTimeout(() => this.state.map.invalidateSize(), 300);
                    this.state.map.setView([this.state.lat, this.state.lon], 7);
                    return;
                }

                this.state.map = L.map('map', { zoomControl: false }).setView([this.state.lat, this.state.lon], 7);
                L.control.zoom({ position: 'topright' }).addTo(this.state.map);
                
                this.updateMapTheme();

                fetch('https://api.rainviewer.com/public/weather-maps.json')
                    .then(res => res.json())
                    .then(data => {
                        if(data.radar && data.radar.past) {
                            const path = data.radar.past[data.radar.past.length - 1].path;
                            this.state.radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${path}/256/{z}/{x}/{y}/2/1_1.png`, {
                                opacity: 0.7, zIndex: 10
                            }).addTo(this.state.map);
                        }
                    });
            },

            updateMapTheme() {
                if (!this.state.map) return;
                
                const style = this.state.isDark ? 'dark_all' : 'light_all';
                const url = `https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`;
                
                if (this.state.baseLayer) this.state.map.removeLayer(this.state.baseLayer);
                
                this.state.baseLayer = L.tileLayer(url, {
                    attribution: '&copy; OpenStreetMap &copy; CARTO'
                }).addTo(this.state.map);
            },

            // --- FAVORITES LOGIC ---
            async searchCity(query) {
                const resDiv = document.getElementById('search-results');
                if (query.length < 3) { resDiv.classList.add('hidden'); return; }

                try {
                    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=5&language=es`);
                    const data = await res.json();
                    
                    resDiv.innerHTML = '';
                    if (data.results) {
                        data.results.forEach(city => {
                            const nameStr = `${city.name}, ${city.admin1 ? city.admin1+', ' : ''}${city.country}`;
                            const el = document.createElement('div');
                            el.className = "p-3 border-b border-gray-500/20 hover:bg-black/10 cursor-pointer text-sm font-medium transition";
                            el.innerText = nameStr;
                            el.onclick = () => {
                                this.addFavorite(city.name, city.latitude, city.longitude, nameStr);
                                resDiv.classList.add('hidden');
                                document.getElementById('search-input').value = '';
                            };
                            resDiv.appendChild(el);
                        });
                        resDiv.classList.remove('hidden');
                    }
                } catch(e) { }
            },

            addFavorite(name, lat, lon, fullName) {
                if(!this.state.favorites.find(f => f.name === name)) {
                    this.state.favorites.push({ name, lat, lon, fullName });
                    localStorage.setItem('nubix_favs', JSON.stringify(this.state.favorites));
                    this.renderFavorites();
                }
            },

            removeFavorite(name, e) {
                e.stopPropagation();
                this.state.favorites = this.state.favorites.filter(f => f.name !== name);
                localStorage.setItem('nubix_favs', JSON.stringify(this.state.favorites));
                this.renderFavorites();
            },

            renderFavorites() {
                const list = document.getElementById('favorites-list');
                list.innerHTML = '';
                
                if(this.state.favorites.length === 0) {
                    list.innerHTML = '<p class="text-muted text-center mt-10">No tienes ciudades guardadas.</p>';
                    return;
                }

                this.state.favorites.forEach(fav => {
                    const el = document.createElement('div');
                    el.className = "glass-panel rounded-3xl p-5 flex justify-between items-center cursor-pointer hover:opacity-80 transition";
                    el.onclick = () => {
                        this.loadLocation(fav.lat, fav.lon, fav.name);
                        this.switchTab('home');
                    };
                    
                    el.innerHTML = `
                        <div>
                            <h3 class="text-xl font-bold">${fav.name}</h3>
                            <p class="text-xs text-muted">${fav.fullName}</p>
                        </div>
                        <button class="p-2 hover:bg-red-500/20 rounded-full transition" onclick="app.removeFavorite('${fav.name}', event)">
                            <i data-lucide="trash-2" class="w-5 h-5 text-red-500"></i>
                        </button>
                    `;
                    list.appendChild(el);
                });
                lucide.createIcons();
            },

            getWindDir(degrees) {
                const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
                return dirs[Math.round(degrees / 45) % 8];
            }
        };

        // Iniciar de forma segura cuando el DOM cargue
        document.addEventListener('DOMContentLoaded', () => app.init());

    </script>
</body>
</html>
